<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字智能创新中心 · 经营看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-card: #141938;
            --bg-card-hover: #1a2048;
            --accent-blue: #00d4ff;
            --accent-gold: #ffa726;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --text-muted: #6b7280;
            --border-color: #2d3748;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* 密码验证页面 */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .password-box {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }

        .password-box h2 {
            color: var(--accent-blue);
            margin-bottom: 24px;
            font-size: 24px;
        }

        .password-box input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
            text-align: center;
            letter-spacing: 4px;
            transition: border-color 0.3s;
        }

        .password-box input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .password-box button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: var(--accent-blue);
            color: var(--bg-primary);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .password-box button:hover {
            background: #00b8e6;
        }

        .password-error {
            color: var(--danger);
            margin-top: 12px;
            font-size: 14px;
            display: none;
        }

        /* 主内容区 */
        .main-content {
            display: none;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .main-content.show {
            display: block;
        }

        /* 顶部标题栏 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-time {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* 总览卡片区 */
        .overview-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .overview-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .overview-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .overview-card .label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .overview-card .value {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .overview-card .value.gold {
            color: var(--accent-gold);
        }

        .overview-card .value.blue {
            color: var(--accent-blue);
        }

        .overview-card .unit {
            font-size: 16px;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        /* 图表区 */
        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .chart-card h3 {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .chart-container {
            height: 320px;
        }

        /* 双饼图布局 */
        .pie-charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        /* 团队区域 */
        .team-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .team-section h3 {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .team-group {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 16px;
        }

        .team-group-title {
            font-size: 14px;
            color: var(--accent-blue);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .team-member {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .team-member:last-child {
            border-bottom: none;
        }

        .team-member .name {
            color: var(--text-primary);
        }

        .team-member .role {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* 搜索和筛选区 */
        .filter-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .filter-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .filter-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: var(--bg-primary);
        }

        /* 表格区 */
        .table-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
        }

        .table-section h3 {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:hover {
            background: var(--bg-card-hover);
        }

        tr.cancelled {
            opacity: 0.5;
        }

        tr.cancelled td {
            text-decoration: line-through;
        }

        .expand-btn {
            background: var(--accent-blue);
            color: var(--bg-primary);
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* 展开详情行 */
        .detail-row {
            display: none;
            background: var(--bg-primary);
        }

        .detail-row.show {
            display: table-row;
        }

        .detail-row td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .detail-item {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
        }

        .detail-item .label {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .detail-item .value {
            color: var(--text-primary);
            font-size: 14px;
        }

        /* 状态标签 */
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .status-badge.pending {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status-badge.active {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-blue);
        }

        .status-badge.cancelled {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .status-badge.preparing {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .status-badge.other {
            background: rgba(107, 114, 128, 0.2);
            color: var(--text-muted);
        }

        /* 项目文档图标 */
        .doc-icon {
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--bg-primary);
            transition: background 0.3s;
        }

        .doc-icon:hover {
            background: var(--accent-blue);
        }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h4 {
            color: var(--accent-blue);
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-body .label {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .modal-body .path {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            color: var(--text-primary);
            word-break: break-all;
        }

        .modal-footer {
            text-align: right;
        }

        .modal-btn {
            padding: 10px 20px;
            background: var(--accent-blue);
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-btn:hover {
            background: #00b8e6;
        }

        /* 负责人/专业方向标签 */
        .person-tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-blue);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .person-tag:hover {
            background: var(--accent-blue);
            color: var(--bg-primary);
        }

        .field-tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255, 167, 38, 0.2);
            color: var(--accent-gold);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .field-tag:hover {
            background: var(--accent-gold);
            color: var(--bg-primary);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 20px;
            }

            .overview-card .value {
                font-size: 28px;
            }

            .charts-section {
                grid-template-columns: 1fr;
            }

            .pie-charts {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 250px;
            }

            .filter-row {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .filter-buttons {
                width: 100%;
                overflow-x: auto;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 4px;
            }

            .team-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 统计数字动画 */
        .stat-animate {
            animation: countUp 1s ease-out;
        }

        @keyframes countUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tab 切换 */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: var(--bg-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: var(--text-muted);
        }

        .loading::after {
            content: "";
            width: 24px;
            height: 24px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 密码验证页面 -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-box">
            <h2>🔐 请输入访问密码</h2>
            <input type="password" id="passwordInput" placeholder="请输入密码" autocomplete="off">
            <button onclick="checkPassword()">确认访问</button>
            <p class="password-error" id="passwordError">密码错误，请重试</p>
        </div>
    </div>

    <!-- 项目文档弹窗 -->
    <div class="modal" id="docModal">
        <div class="modal-content">
            <div class="modal-header">
                <h4>📁 项目文档</h4>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="label">项目名称</div>
                <div class="value" id="modalProjectName" style="margin-bottom: 16px;"></div>
                <div class="label">云电脑文件夹路径</div>
                <div class="path" id="modalProjectPath"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content" id="mainContent">
        <header class="header">
            <h1>数字智能创新中心 · 经营看板</h1>
            <span class="header-time" id="updateTime"></span>
        </header>

        <!-- 总览卡片 -->
        <section class="overview-cards">
            <div class="overview-card">
                <div class="label">合同总额</div>
                <div class="value gold stat-animate" id="totalContract">0</div>
                <span class="unit">万元</span>
            </div>
            <div class="overview-card">
                <div class="label">待收款总额</div>
                <div class="value gold stat-animate" id="totalPending">0</div>
                <span class="unit">万元</span>
            </div>
            <div class="overview-card">
                <div class="label">2026计划收款</div>
                <div class="value blue stat-animate" id="totalPlan">0</div>
                <span class="unit">万元</span>
            </div>
            <div class="overview-card">
                <div class="label">活跃项目数</div>
                <div class="value blue stat-animate" id="activeProjects">0</div>
                <span class="unit">个</span>
            </div>
        </section>

        <!-- 图表区 -->
        <section class="charts-section">
            <div class="chart-card">
                <h3>📊 季度收款计划（按项目类型）</h3>
                <div class="chart-container" id="quarterlyChart"></div>
            </div>
            <div class="chart-card">
                <h3>📈 合同额年度趋势</h3>
                <div class="chart-container" id="yearlyChart"></div>
            </div>
        </section>

        <!-- 计划vs实际对比图 -->
        <section class="charts-section">
            <div class="chart-card">
                <h3>📊 计划收款 vs 实际收款对比</h3>
                <div class="chart-container" id="planActualChart"></div>
            </div>
        </section>

        <!-- 饼图区 -->
        <section class="pie-charts">
            <div class="chart-card">
                <h3>📊 项目类型分布</h3>
                <div class="chart-container" id="typeChart"></div>
            </div>
            <div class="chart-card">
                <h3>📊 项目状态分布</h3>
                <div class="chart-container" id="statusChart"></div>
            </div>
        </section>

        <!-- 团队区域 -->
        <section class="team-section">
            <h3>👥 团队成员</h3>
            <div class="team-grid" id="teamGrid"></div>
        </section>

        <!-- Tab 切换 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('projects')">📋 项目列表</button>
            <button class="tab-btn" onclick="switchTab('clients')">📇 甲方通讯录</button>
        </div>

        <!-- 项目列表 -->
        <div class="tab-content active" id="projectsTab">
            <div class="filter-section">
                <div class="filter-row">
                    <div class="search-box">
                        <input type="text" id="projectSearch" placeholder="搜索项目名称、甲方、类型..." oninput="filterProjects()">
                    </div>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="全部" onclick="setProjectFilter('全部', 'type')">类型: 全部</button>
                        <button class="filter-btn" data-filter="研究" onclick="setProjectFilter('研究', 'type')">研究</button>
                        <button class="filter-btn" data-filter="集成开发" onclick="setProjectFilter('集成开发', 'type')">集成开发</button>
                        <button class="filter-btn" data-filter="服务" onclick="setProjectFilter('服务', 'type')">服务</button>
                    </div>
                    <div class="filter-buttons" style="margin-left: 8px;">
                        <button class="filter-btn active" data-filter="负责人-全部" onclick="setProjectFilter('全部', 'person')">负责人: 全部</button>
                        <button class="filter-btn" data-filter="负责人-胡晓飞" onclick="setProjectFilter('胡晓飞', 'person')">胡晓飞</button>
                        <button class="filter-btn" data-filter="负责人-韩江雪" onclick="setProjectFilter('韩江雪', 'person')">韩江雪</button>
                        <button class="filter-btn" data-filter="负责人-袁誉菲" onclick="setProjectFilter('袁誉菲', 'person')">袁誉菲</button>
                        <button class="filter-btn" data-filter="负责人-欧阳玲" onclick="setProjectFilter('欧阳玲', 'person')">欧阳玲</button>
                        <button class="filter-btn" data-filter="负责人-石名扬" onclick="setProjectFilter('石名扬', 'person')">石名扬</button>
                    </div>
                </div>
                <div class="filter-row" style="margin-top: 12px;">
                    <div class="filter-buttons">

        function calculateStats() {
            let total_contract = 0;
            let total_pending = 0;
            let total_2026_plan = 0;
            let active_projects = 0;
            const year_stats = { 2024: 0, 2025: 0, 2026: 0 };
            const type_stats = { '研究': 0, '集成开发': 0, '服务': 0 };
            const status_stats = {};

            PROJECTS.forEach(p => {
                const year = getYear(p.name);
                const isCancelled = p.phase === '撤销立项';

                // 不统计撤销立项和合同额为0的项目
                if (!isCancelled && p.contract > 0) {
                    total_contract += p.contract;
                    total_pending += p.pending;

                    // 2026计划收款 = Q1~Q4计划收款总和
                    // 由PLAN_DATA统一计算，此处不再逐项目累加

                    if (year) {
                        year_stats[year] += p.contract;
                    }

                    type_stats[p.type] = (type_stats[p.type] || 0) + p.contract;

                    if (p.phase !== '撤销立项') {
                        status_stats[p.phase] = (status_stats[p.phase] || 0) + 1;
                    }
                }

                if (!isCancelled && p.phase !== '撤销立项') {
                    active_projects++;
                }
            });

            // 2026计划收款 = PLAN_DATA Q1~Q4总和
            total_2026_plan = Object.values(PLAN_DATA).reduce((sum, q) => sum + q.research + q.develop + q.service, 0);

            return {
                total_contract,
                total_pending,
                total_2026_plan,
                active_projects,
                year_stats,
                type_stats,
                status_stats
            };
        }

        // 动画数字
        function animateNumber(elementId, targetValue) {
            const element = document.getElementById(elementId);
            const duration = 1000;
            const startTime = performance.now();
            const startValue = 0;

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const currentValue = startValue + (targetValue - startValue) * easeProgress;

                element.textContent = targetValue >= 100 ? Math.round(currentValue) : currentValue.toFixed(2);

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }

                yAxis: {
                    type: 'value',
                    name: '万元',
                    axisLine: { lineStyle: { color: '#2d3748' } },
                    axisLabel: { color: '#a0aec0' },
                    splitLine: { lineStyle: { color: '#1a2048' } }
                },
                series: [
                    {
                        name: '计划收款',
                        type: 'bar',
                        data: planTotals,
                        itemStyle: { color: '#00d4ff' },
                        barWidth: '30%',
                        label: {
                            show: true,
                            position: 'top',
                            color: '#00d4ff',
                            formatter: '{c}万'
                        }
                    },
                    {
                        name: '实际收款',
                        type: 'bar',
                        data: actualTotals,
                        itemStyle: { color: '#10b981' },
                        barWidth: '30%',
                        label: {
                            show: true,
                            position: 'top',
                            color: '#10b981',
                            formatter: function(p) {
                                return p.value > 0 ? p.value.toFixed(2) + '万' : '-';
                            }
                        }
                    }
                ]
            });

            window.addEventListener('resize', () => chart.resize());
        }

        // 项目类型饼图
        function initTypeChart() {
            const chart = echarts.init(document.getElementById('typeChart'));
            const colors = ['#00d4ff', '#ffa726', '#10b981'];

            const stats = calculateStats();
            const typeData = Object.entries(stats.type_stats)
                .filter(([name, value]) => value > 0)
                .map(([name, value], index) => ({
                    name: name,
                    value: value,
                    itemStyle: { color: colors[index % colors.length] }
                }));

            chart.setOption({
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c} 万元 ({d}%)'
                },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['50%', '50%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#141938',
                        borderWidth: 2
                    },
                    label: {
                        show: true,
                        color: '#a0aec0',
                        fontSize: 11
                    },
                    data: typeData
                }]
            });

            window.addEventListener('resize', () => chart.resize());
        }

        // 项目状态饼图
        function initStatusChart() {
            const chart = echarts.init(document.getElementById('statusChart'));
            const statusColors = {
                '待收尾款': '#10b981',
                '进行中': '#00d4ff',
                '已立项未招采': '#f59e0b',
                '可研编制': '#8b5cf6',
                '项目建议书编制': '#ec4899',
                '撤销立项': '#ef4444'
            };

            const stats = calculateStats();
            const statusData = Object.entries(stats.status_stats).map(([name, value]) => ({
                name: name + '(' + value + ')',
                value: value,
                itemStyle: { color: statusColors[name] || '#6b7280' }
            }));

            chart.setOption({
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c} 个 ({d}%)'
                },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['50%', '50%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#141938',
                        borderWidth: 2
                    },
                    label: {
                        show: true,
                        color: '#a0aec0',
                        fontSize: 11
                    },
                    data: statusData
                }]
            });

            window.addEventListener('resize', () => chart.resize());
        }

        // 渲染团队
        function renderTeam() {
            const grid = document.getElementById('teamGrid');
            let html = '';

            for (const [groupName, members] of Object.entries(TEAM_DATA)) {
                html += `
                    <div class="team-group">
                        <div class="team-group-title">${groupName}</div>
                        ${members.map(m => `
                            <div class="team-member">
                                <span class="name">${m.name}</span>
                                <span class="role">${m.role}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        // 获取状态标签
        function getStatusBadge(status) {
            const statusMap = {
                '待收尾款': 'pending',
                '进行中': 'active',
                '撤销立项': 'cancelled',
                '已立项未招采': 'preparing',
                '可研编制': 'preparing',
                '项目建议书编制': 'preparing'
            };
            const className = statusMap[status] || 'other';
            return '<span class="status-badge ' + className + '">' + (status || '未知') + '</span>';
        }

        // 渲染项目表格
        function renderProjectTable() {
            const tbody = document.getElementById('projectTableBody');
            const searchTerm = document.getElementById('projectSearch').value.toLowerCase();

            const filtered = PROJECTS.filter(p => {
                const matchSearch = !searchTerm ||
                    p.name.toLowerCase().includes(searchTerm) ||
                    p.client.toLowerCase().includes(searchTerm) ||
                    p.type.toLowerCase().includes(searchTerm) ||
                    getPerson(p.name).toLowerCase().includes(searchTerm) ||
                    getField(p.name).toLowerCase().includes(searchTerm);
                const matchType = currentTypeFilter === '全部' || p.type === currentTypeFilter;
                const matchPerson = currentPersonFilter === '全部' || getPerson(p.name) === currentPersonFilter;
                const matchField = currentFieldFilter === '全部' || getField(p.name) === currentFieldFilter;
                return matchSearch && matchType && matchPerson && matchField;
            });

            tbody.innerHTML = filtered.map((p, index) => {
                const isCancelled = p.phase === '撤销立项';
                const isExpanded = expandedRows.has(p.name);
                const year = getYear(p.name);
                const person = getPerson(p.name);
                const field = getField(p.name);
                const docPath = getDocPath(p.name);

                const detailRow = `
                    <tr class="detail-row ${isExpanded ? 'show' : ''}" id="detail-${index}">
                        <td colspan="19">
                            <div class="detail-content">
                                <div class="detail-item">
                                    <div class="label">甲方单位</div>
                                    <div class="value">${p.client || '-'}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="label">负责人</div>
                                    <div class="value">${person}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="label">专业方向</div>
                                    <div class="value">${field}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="label">项目类型</div>
                                    <div class="value">${p.type}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="label">当前阶段</div>
                                    <div class="value">${p.phase}</div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;

                return `
                    <tr class="${isCancelled ? 'cancelled' : ''}">
                        <td><button class="expand-btn" onclick="toggleDetail('${p.name.replace(/'/g, "\\'")}', ${index})">${isExpanded ? '收起' : '详情'}</button></td>
                        <td>${p.name}</td>
                        <td>${docPath ? '<span class="doc-icon" onclick="openDocModal(\'' + p.name.replace(/'/g, "\\'") + '\')">📁</span>' : '-'}</td>
                        <td>${year || '-'}</td>
                        <td>${p.type}</td>
                        <td><span class="person-tag" onclick="setProjectFilter('${person}', 'person')">${person}</span></td>
                        <td><span class="field-tag" onclick="setProjectFilter('${field}', 'field')">${field}</span></td>
                        <td>${p.contract > 0 ? p.contract.toFixed(2) : '-'}</td>
                        <td>${getStatusBadge(p.phase)}</td>
                        <td>${p.pending > 0 ? p.pending.toFixed(2) : '-'}</td>
                        <td>${p.q1 > 0 ? p.q1.toFixed(2) : '-'}</td>
                        <td>${p.q2 > 0 ? p.q2.toFixed(2) : '-'}</td>
                        <td>${p.q3 > 0 ? p.q3.toFixed(2) : '-'}</td>
                        <td>${p.q4 > 0 ? p.q4.toFixed(2) : "-"}</td><td>${p.aq1 > 0 ? p.aq1.toFixed(2) : "-"}</td><td>${p.aq2 > 0 ? p.aq2.toFixed(2) : "-"}</td><td>${p.aq3 > 0 ? p.aq3.toFixed(2) : "-"}</td><td>${p.aq4 > 0 ? p.aq4.toFixed(2) : "-"}</td><td>${p.client || '-'}</td>
                    </tr>
                    ${detailRow}
                `;
            }).join('');

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="19" class="empty-state">没有找到匹配的项目</td></tr>';
            }
        }

        // 展开/收起详情
        function toggleDetail(name, index) {
            if (expandedRows.has(name)) {
                expandedRows.delete(name);
            } else {
                expandedRows.add(name);
            }
            renderProjectTable();
        }

        // 筛选项目
        function setProjectFilter(value, filterType) {
            if (filterType === 'type') {
                currentTypeFilter = value;
                document.querySelectorAll('[data-filter^="负责人"], [data-filter^="专业"]').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelectorAll('[data-filter^="类型"], [data-filter^="研究"], [data-filter^="集成"], [data-filter^="服务"]').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === '类型:' + value);
                });
                if (value === '全部') {
                    document.querySelector('[data-filter="类型: 全部"]').classList.add('active');
                }
            } else if (filterType === 'person') {
                currentPersonFilter = value;
                document.querySelectorAll('[data-filter^="类型"], [data-filter^="专业"]').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelectorAll('[data-filter^="负责人"]').forEach(btn => {
                    const isMatch = value === '全部' ? btn.dataset.filter === '负责人-全部' : btn.dataset.filter === '负责人-' + value;
                    btn.classList.toggle('active', isMatch);
                });
            } else if (filterType === 'field') {
                currentFieldFilter = value;
                document.querySelectorAll('[data-filter^="类型"], [data-filter^="负责人"]').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelectorAll('[data-filter^="专业"]').forEach(btn => {
                    const isMatch = value === '全部' ? btn.dataset.filter === '专业-全部' : btn.dataset.filter === '专业-' + value;
                    btn.classList.toggle('active', isMatch);
                });
            }
            renderProjectTable();
        }

        function filterProjects() {
            renderProjectTable();
        }

        // 渲染客户表格
        function renderClientTable() {
            const tbody = document.getElementById('clientTableBody');
            const searchTerm = document.getElementById('clientSearch').value.toLowerCase();

            const filtered = CLIENTS.filter(c => {
                const matchSearch = !searchTerm ||
                    c.client.toLowerCase().includes(searchTerm) ||
                    c.contact.toLowerCase().includes(searchTerm) ||
                    c.position.toLowerCase().includes(searchTerm);
                const matchType = currentClientFilter === '全部' || c.type === currentClientFilter;
                return matchSearch && matchType;
            });

            tbody.innerHTML = filtered.map(c => `
                <tr>
                    <td>${c.client}</td>
                    <td>${c.type || '-'}</td>
                    <td>${c.contact || '-'}</td>
                    <td>${c.position || '-'}</td>
                    <td>${c.phone || '-'}</td>
                </tr>
            `).join('');

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">没有找到匹配的客户</td></tr>';
            }
        }

        // 筛选客户
        function setClientFilter(type) {
            currentClientFilter = type;
            document.querySelectorAll('#clientsTab .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            renderClientTable();
        }

        function filterClients() {
            renderClientTable();
        }
    </script>
</body>
</html>
